{% extends "base.html" %}
{% block title %}Reset your password | Recipe Finder{% endblock %}
{% block content %}
<div class="container"><div class="auth-card">
  <h1 class="h3 mb-1">Reset your password</h1>
  <p class="text-muted">Enter your email address and we'll send you a reset link.</p>
  <form method="post" novalidate>{% csrf_token %}{% include "accounts/_form_fields.html" %}
    <button class="btn btn-primary w-100" type="submit">Send reset link</button></form>
  <p class="mt-3 small mb-0"><a href="{% url 'accounts:login' %}">Back to login</a></p>
</div></div>
{% endblock %}
