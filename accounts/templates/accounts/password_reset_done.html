{% extends "base.html" %}
{% block title %}Check your email | Recipe Finder{% endblock %}
{% block content %}
<div class="container"><div class="auth-card text-center">
  <i class="bi bi-envelope-check display-4 text-green"></i>
  <h1 class="h3 mt-2">Check your email</h1>
  <p class="text-muted">If an account exists for that address, a password reset link is on its way. In development the email is printed in the server console.</p>
  <a class="btn btn-primary" href="{% url 'accounts:login' %}">Back to login</a>
</div></div>
{% endblock %}
