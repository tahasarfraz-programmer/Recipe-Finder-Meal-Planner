{% extends "base.html" %}
{% block title %}Create an account | Recipe Finder{% endblock %}
{% block content %}
<div class="container"><div class="auth-card">
  <h1 class="h3 mb-1">Create your account</h1>
  <p class="text-muted">Save favorites, plan meals and build shopping lists.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "accounts/_form_fields.html" %}
    <button class="btn btn-primary w-100" type="submit">Create account</button>
  </form>
  <p class="mt-3 small mb-0">Already registered? <a href="{% url 'accounts:login' %}">Log in</a></p>
</div></div>
{% endblock %}
