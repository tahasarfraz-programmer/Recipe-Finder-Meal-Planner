{% extends "base.html" %}
{% block title %}Page not found | Recipe Finder{% endblock %}
{% block content %}
<div class="container error-page">
  <div class="code">404</div>
  <h1 class="h3 mt-3">We couldn't find that page</h1>
  <p class="text-muted">The link may be broken, or the recipe may have been removed.</p>
  <a class="btn btn-primary" href="{% url 'recipes:list' %}">Browse recipes</a>
  <a class="btn btn-outline-primary" href="{% url 'home' %}">Go home</a>
</div>
{% endblock %}
