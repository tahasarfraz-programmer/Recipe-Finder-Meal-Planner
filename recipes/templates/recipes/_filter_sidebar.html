<form method="get" action="{{ request.path }}" class="filter-card p-3" aria-label="Filter recipes">
  <div class="mb-3">
    <label for="filter-q" class="form-label fw-bold">Search</label>
    <input id="filter-q" class="form-control" type="search" name="q" value="{{ q }}" placeholder="e.g. chicken pasta, vegan dinner">
  </div>
  <div class="mb-3">
    <label for="filter-sort" class="form-label fw-bold">Sort by</label>
    <select id="filter-sort" class="form-select" name="sort">
      {% for value, label in sort_choices %}<option value="{{ value }}" {% if sort == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </div>

  <fieldset class="filter-group">
    <legend>Category</legend>
    {% for c in categories %}
    <div class="form-check"><input class="form-check-input" type="checkbox" name="category" value="{{ c.slug }}" id="cat-{{ c.slug }}" {% if c.slug in selected.category %}checked{% endif %}>
      <label class="form-check-label" for="cat-{{ c.slug }}">{{ c.name }}</label></div>
    {% endfor %}
  </fieldset>
  <fieldset class="filter-group">
    <legend>Cuisine</legend>
    {% for c in cuisines %}
    <div class="form-check"><input class="form-check-input" type="checkbox" name="cuisine" value="{{ c.slug }}" id="cui-{{ c.slug }}" {% if c.slug in selected.cuisine %}checked{% endif %}>
      <label class="form-check-label" for="cui-{{ c.slug }}">{{ c.name }}</label></div>
    {% endfor %}
  </fieldset>
  <fieldset class="filter-group">
    <legend>Dietary preferences</legend>
    {% for d in diets %}
    <div class="form-check"><input class="form-check-input" type="checkbox" name="diet" value="{{ d.slug }}" id="diet-{{ d.slug }}" {% if d.slug in selected.diet %}checked{% endif %}>
      <label class="form-check-label" for="diet-{{ d.slug }}">{{ d.name }}</label></div>
    {% endfor %}
  </fieldset>
  <fieldset class="filter-group">
    <legend>Difficulty</legend>
    {% for value, label in difficulty_choices %}
    <div class="form-check"><input class="form-check-input" type="checkbox" name="difficulty" value="{{ value }}" id="diff-{{ value }}" {% if value in selected.difficulty %}checked{% endif %}>
      <label class="form-check-label" for="diff-{{ value }}">{{ label }}</label></div>
    {% endfor %}
  </fieldset>
  <fieldset class="filter-group">
    <legend>Total time</legend>
    <div class="form-check"><input class="form-check-input" type="radio" name="time" value="" id="time-any" {% if not selected.time %}checked{% endif %}>
      <label class="form-check-label" for="time-any">Any</label></div>
    {% for value, label in time_choices %}
    <div class="form-check"><input class="form-check-input" type="radio" name="time" value="{{ value }}" id="time-{{ value }}" {% if selected.time == value %}checked{% endif %}>
      <label class="form-check-label" for="time-{{ value }}">{{ label }}</label></div>
    {% endfor %}
  </fieldset>
  <div class="d-grid gap-2 mt-2">
    <button class="btn btn-primary" type="submit"><i class="bi bi-funnel"></i> Apply filters</button>
    <a class="btn btn-outline-secondary" href="{{ request.path }}">Clear all</a>
  </div>
</form>
